name: VITANET QA
on:
  push:
    branches: [ test/vitanet-integrated-qa-2026-11-19 ]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'database/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/qa-vitanet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate inline JavaScript, role controls and workflow hooks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x => x[1]).filter(x => x.trim());
          if (scripts.length < 2) throw new Error('Expected login and app scripts');
          scripts.forEach((source, i) => { try { new Function(source); } catch (e) { throw new Error('Inline script ' + i + ': ' + e.message); } });
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x => x[1]);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate HTML id found');
          const required = ['loginIdentifier','loginBtn','password','shopZoneFilter','stockReceive','stockAdjust','receiveReturn','staffGps','staffGpsNav','refreshStaffGps'];
          for (const id of required) if (!ids.includes(id)) throw new Error('Missing required element: ' + id);
          const hooks = ['vita-staff-login','persistSession:true','watchPosition','vita_staff_locations','vita_start_workday','vita_end_workday','vita_stock_receive','vita_stock_adjust','vita_receive_catalog_return','printCatalogInvoice','printSalesRequest','vita_assign_catalog_order_delivery','vita_mark_catalog_order_delivered'];
          for (const token of hooks) if (!html.includes(token)) throw new Error('Missing required workflow hook: ' + token);
          if (html.includes('VITANET • УПРАВЛЕНИЕ КОМАНДОЙ') || html.includes('<img class="brand-logo"')) throw new Error('In-app branding header should be removed');
          if ((html.match(/let pendingCatalogOrderId=null;/g) || []).length !== 1) throw new Error('Duplicate pendingCatalogOrderId declaration');
          console.log('VITANET static QA passed');
          NODE
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check public catalog order and stock edge function
        run: deno check supabase/functions/vita-catalog-orders/index.ts
